name: Validate updater
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Go tests and static checks
        run: |
          go test -race ./...
          go vet ./...
          test -z "$(gofmt -l cmd internal)"
      - name: Build standalone Linux updater
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -buildvcs=false -ldflags='-s -w' -o dist/amp-wart-update-linux-amd64 ./cmd/amp-wart-update
      - name: AMP installer and publisher tests (no node execution)
        run: python3 -B -m unittest discover -s tests -v